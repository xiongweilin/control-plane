name: C4a verifier obligation ownership wiring

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c4a/verifier-obligation-owner
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - name: Apply narrow C4a wiring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int | None = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8-sig")
              if old not in text:
                  raise SystemExit(f"missing C4a anchor in {path}: {old[:180]!r}")
              text = text.replace(old, new, -1 if count is None else count)
              p.write_text(text, encoding="utf-8")

          verifier = "src/control_plane/verifier.py"
          replace(
              verifier,
              '''    obligation_refs: list[str] = field(default_factory=list)\n    @property\n''',
              '''    obligation_refs: list[str] = field(default_factory=list)\n\n    @classmethod\n    def from_checks(cls, *, repair_id: str, checks: list[CheckResult]) -> VerificationReport:\n        \"\"\"Build a report with the verifier-owned check-to-obligation projection.\"\"\"\n\n        normalized_checks = list(checks)\n        return cls(\n            repair_id=repair_id,\n            checks=normalized_checks,\n            obligation_refs=obligation_refs_for_checks(normalized_checks),\n        )\n\n    @property\n''',
          )
          replace(
              verifier,
              '        return VerificationReport(repair_id=repair_id, checks=checks)\n',
              '        return VerificationReport.from_checks(repair_id=repair_id, checks=checks)\n',
              count=None,
          )
          replace(
              verifier,
              '''            return VerificationReport(repair_id=repair_id, checks=[CheckResult("minimum_evidence", False, "No deterministic verification was configured")])  # noqa: E501\n''',
              '''            checks = [CheckResult("minimum_evidence", False, "No deterministic verification was configured")]\n            return VerificationReport.from_checks(repair_id=repair_id, checks=checks)\n''',
          )

          replace(
              "src/control_plane/service.py",
              '''                failure_report = VerificationReport(\n                    repair_id=repair_id,\n                    checks=[CheckResult("verification_failure", False, error_text)],\n                )\n''',
              '''                failure_report = VerificationReport.from_checks(\n                    repair_id=repair_id,\n                    checks=[CheckResult("verification_failure", False, error_text)],\n                )\n''',
          )

          old_projection = '''        declared_refs = [\n            str(ref).strip()\n            for ref in report.obligation_refs\n            if isinstance(ref, str) and ref.strip()\n        ]\n        derived_refs = obligation_refs_for_checks(report.checks)\n        if declared_refs and not set(derived_refs).issubset(declared_refs):\n            missing = sorted(set(derived_refs).difference(declared_refs))\n            raise ValueError(\n                "typed verification report omits obligations for checks: "\n                + ", ".join(missing)\n            )\n        obligation_refs = list(dict.fromkeys(declared_refs or derived_refs))\n'''
          new_projection = '''        declared_refs = list(\n            dict.fromkeys(\n                str(ref).strip()\n                for ref in report.obligation_refs\n                if isinstance(ref, str) and ref.strip()\n            )\n        )\n        derived_refs = list(dict.fromkeys(obligation_refs_for_checks(report.checks)))\n        if declared_refs != derived_refs:\n            missing = [ref for ref in derived_refs if ref not in declared_refs]\n            extra = [ref for ref in declared_refs if ref not in derived_refs]\n            detail = []\n            if missing:\n                detail.append("missing=" + ",".join(missing))\n            if extra:\n                detail.append("extra=" + ",".join(extra))\n            if not detail:\n                detail.append("order-or-duplicate-normalization-mismatch")\n            raise ValueError(\n                "typed verification report obligation projection mismatch: "\n                + "; ".join(detail)\n            )\n        obligation_refs = declared_refs\n'''
          replace("src/control_plane/portable_authority.py", old_projection, new_projection)

          replace(
              "tests/test_personal_runtime_authority.py",
              '''                obligation_refs=["provider_status", "verify.http", "verify.git_diff"],\n''',
              '''                obligation_refs=["provider_status"],\n''',
          )
          PY
      - name: Mechanical checks
        run: |
          uv run ruff check src/control_plane/verifier.py src/control_plane/portable_authority.py src/control_plane/service.py tests/test_personal_runtime_authority.py
          uv run python -m pytest tests/test_verifier.py tests/test_personal_runtime_authority.py
      - name: Commit clean C4a product/test wiring
        shell: bash
        run: |
          git rm .github/workflows/c4a-wire.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/control_plane/verifier.py src/control_plane/portable_authority.py src/control_plane/service.py tests/test_personal_runtime_authority.py
          git commit -m "C4a: make verifier own obligation projection"
          git push origin HEAD:c4a/verifier-obligation-owner
