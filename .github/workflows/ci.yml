name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync Agent Kernel dependency and dev tools
        run: uv sync --extra dev
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        shell: bash
        run: |
          set +e
          output="$(uv run mypy src --no-incremental --show-error-codes 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              case "$line" in
                *"error:"*) echo "::error::$line" ;;
              esac
            done <<< "$output"
          fi
          exit "$status"
      - name: Pytest
        run: uv run pytest -q --cov=src/control_plane --cov-report=xml:coverage.xml
      - name: Prove no embedded kernel remains
        run: |
          test ! -e src/portable_runtime
          test ! -e portable-runtime-pin.json
          test ! -e src/control_plane/service.py
          test ! -e src/control_plane/storage.py
          test ! -e src/control_plane/portable_authority.py
          test ! -e src/control_plane/closure_authority.py
          test ! -e src/control_plane/reconciliation.py
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
      - name: SonarQube Cloud Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.1
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
