name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv (cached)
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --locked --extra dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Mypy (src)
        run: uv run mypy src

      - name: Portable core import boundary
        run: uv run python scripts/check_portable_core_imports.py

      - name: Pytest (portable suite)
        # test_env_scan_all_healthy and test_terminate_process_tree_kills_children
        # are Windows-only (local C:\/D:\ disk scan, WMI process snapshot); they
        # run in the windows-native job on the actual target platform.
        run: uv run pytest -k "not (test_env_scan_all_healthy or test_terminate_process_tree_kills_children)"

      - name: Coverage gate
        # Baseline captured from this portable suite (scripts/coverage-baseline.txt).
        run: uv run python scripts/check_coverage.py --pytest-args "-k 'not (test_env_scan_all_healthy or test_terminate_process_tree_kills_children)'"

  windows-native:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv (cached)
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --locked --extra dev

      - name: Pytest (Windows-only tests)
        run: uv run pytest -k "test_env_scan_all_healthy or test_terminate_process_tree_kills_children"
