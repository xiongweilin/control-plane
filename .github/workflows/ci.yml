name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  c4b-wire:
    if: github.event_name == 'pull_request' && github.head_ref == 'c4b/outward-semantics-integrity' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c4b/outward-semantics-integrity
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Sync locked dependencies
        run: uv sync --locked --extra dev
      - name: Apply narrow C4b wiring
        shell: bash
        run: |
          sed -i 's/integrity_counts = {kind: 0 for kind in INTEGRITY_KINDS}/integrity_counts = dict.fromkeys(INTEGRITY_KINDS, 0)/' scripts/c4b_wire.py
          uv run python scripts/c4b_wire.py
      - name: Focused C4b checks
        run: |
          uv run ruff check src/control_plane/outward_semantics.py src/control_plane/app.py src/control_plane/service.py src/control_plane/metrics.py tests/test_c4b_outward_semantics.py
          uv run mypy src/control_plane/outward_semantics.py src/control_plane/app.py src/control_plane/service.py src/control_plane/metrics.py
          uv run python -m pytest tests/test_c4b_outward_semantics.py tests/test_app.py tests/test_metrics.py
      - name: Commit clean C4b product state
        shell: bash
        run: |
          git rm .github/workflows/c4b-wire.yml scripts/c4b_wire.py
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/ci.yml src/control_plane/outward_semantics.py src/control_plane/app.py src/control_plane/service.py src/control_plane/metrics.py tests/test_c4b_outward_semantics.py
          git commit -m "C4b: expose repair semantics and integrity observability"
          git push origin HEAD:c4b/outward-semantics-integrity

  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv (cached)
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --locked --extra dev

      - name: Verify public portable-runtime pin
        shell: bash
        run: |
          pin="$(python -c 'import json; print(json.load(open("portable-runtime-pin.json", encoding="utf-8"))["commit"])')"
          git clone --filter=blob:none --no-checkout https://github.com/xiongweilin/portable-runtime.git "$RUNNER_TEMP/portable-runtime"
          git -C "$RUNNER_TEMP/portable-runtime" fetch --depth=1 origin "$pin"
          git -C "$RUNNER_TEMP/portable-runtime" checkout --detach "$pin"
          uv run python scripts/verify_portable_runtime_pin.py --public-root "$RUNNER_TEMP/portable-runtime"

      - name: Ruff check
        run: uv run ruff check .

      - name: Mypy (src)
        run: uv run mypy src

      - name: Portable core import boundary
        run: uv run python scripts/check_portable_core_imports.py

      - name: Pytest (portable suite)
        run: uv run python -m pytest -k "not (test_env_scan_all_healthy or test_terminate_process_tree_kills_children)"

      - name: Coverage gate
        run: uv run python scripts/check_coverage.py --pytest-args "-k 'not (test_env_scan_all_healthy or test_terminate_process_tree_kills_children)'"

  windows-native:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv (cached)
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --locked --extra dev

      - name: Pytest (Windows-only tests)
        run: uv run python -m pytest -k "test_env_scan_all_healthy or test_terminate_process_tree_kills_children"

  sonarcloud:
    # SonarCloud project authorization is configured only for the public
    # project's main branch; keep private feature-branch CI deterministic when
    # the optional repository secret is absent.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 30
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv (cached)
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          enable-cache: true
      - name: Sync locked dependencies
        run: uv sync --locked --extra dev
      - name: Generate coverage for SonarCloud
        run: uv run python -m pytest --cov=src --cov-report=xml --cov-report=term -k "not (test_env_scan_all_healthy or test_terminate_process_tree_kills_children)" --junitxml=pytest-junit.xml
      - name: SonarCloud Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
      - name: SonarCloud skipped without token
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "SONAR_TOKEN is not configured; skipping optional SonarCloud analysis."
