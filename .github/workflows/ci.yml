name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync Agent Kernel dependency and dev tools
        run: uv sync --extra dev
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy src
      - name: Pytest
        run: uv run pytest -q
      - name: Prove no embedded kernel remains
        run: |
          test ! -e src/portable_runtime
          test ! -e portable-runtime-pin.json
          test ! -e src/control_plane/service.py
          test ! -e src/control_plane/storage.py
          test ! -e src/control_plane/portable_authority.py
          test ! -e src/control_plane/closure_authority.py
          test ! -e src/control_plane/reconciliation.py
