name: Apply terminal audit metadata compatibility fix

on:
  push:
    branches:
      - compat/terminal-audit-metadata
    paths:
      - .github/workflows/compat-terminal-audit-metadata.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Patch stale mirrored conformance fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/conformance/test_terminal_authority.py")
          text = path.read_text(encoding="utf-8")
          old = '''        terminal_work = terminal_work.model_copy(update={"metadata": {"_completion_proof_refs": [proof.id]}})\n        terminal_run = terminal_run.model_copy(update={"metadata": {"_completion_proof_refs": [proof.id]}})\n        assert store.commit_terminal(terminal_work, terminal_run, [proof.id]).status == "succeeded"\n'''
          new = '''        required = CompletionAuthority.required_obligation_refs(work)\n        audit = {\n            "_completion_proof_refs": [proof.id],\n            "completion_required_obligations": sorted(required),\n            "completion_covered_obligations": sorted(required),\n            "completion_missing_obligations": [],\n        }\n        terminal_work = terminal_work.model_copy(update={"metadata": dict(audit)})\n        terminal_run = terminal_run.model_copy(update={"metadata": dict(audit)})\n        assert store.commit_terminal(terminal_work, terminal_run, [proof.id]).status == "succeeded"\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one stale fixture block, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Ensure only compatibility test changes survive
        shell: bash
        run: |
          git rm .github/workflows/compat-terminal-audit-metadata.yml
          changed="$(git diff --name-only --cached; git diff --name-only)"
          printf '%s\n' "$changed"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(.github/workflows/compat-terminal-audit-metadata\.yml|tests/conformance/test_terminal_authority\.py)$' || true)"
          if [ -n "$bad" ]; then
            echo "$bad"
            exit 1
          fi

      - name: Commit compatibility-only test update
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/conformance/test_terminal_authority.py
          git commit -m "test: align terminal audit metadata contract"
          git push origin HEAD:compat/terminal-audit-metadata
