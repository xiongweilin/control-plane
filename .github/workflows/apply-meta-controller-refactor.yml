name: Finalize meta-controller integration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-meta-controller-refactor.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Refresh lock and remove migration code
        run: |
          uv lock
          rm -f scripts/apply_meta_controller_refactor.py
      - name: Run full checks on final code
        run: |
          uv sync --extra dev
          uv run ruff check .
          uv run mypy src --no-incremental --show-error-codes
          uv run pytest -q
      - name: Remove one-shot workflow
        run: rm -f .github/workflows/apply-meta-controller-refactor.yml
      - name: Commit final state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Finalize meta-controller integration"
          git push origin HEAD:main
