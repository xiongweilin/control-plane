name: Apply meta-controller refactor

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-meta-controller-refactor.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Apply deterministic refactor
        run: python scripts/apply_meta_controller_refactor.py
      - name: Refresh lock and validate changed Python
        run: |
          uv lock
          uv sync --extra dev
          uv run ruff check src/control_plane/alert_policy.py src/control_plane/__init__.py tests/test_meta_policy_integration.py scripts/apply_meta_controller_refactor.py
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Remove obsolete controller policy state machines"
          git push origin HEAD:main
