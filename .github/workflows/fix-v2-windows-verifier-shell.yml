name: Fix V2 Windows verifier shell

on:
  push:
    branches:
      - vendor/portable-runtime-0a22ad07-public-v2
    paths:
      - .github/workflows/fix-v2-windows-verifier-shell.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Make Windows verifier use Bash env expansion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/vendor-sync-portable-runtime-public-v2.yml')
          text = path.read_text(encoding='utf-8')
          needle = '''      - name: Verify exact public pin and tree digest\n        run: uv run python scripts/verify_portable_runtime_pin.py --public-root "$RUNNER_TEMP/portable-runtime"\n'''
          if text.count(needle) != 2:
              raise SystemExit(f'expected two verifier blocks, found {text.count(needle)}')
          replacement = '''      - name: Verify exact public pin and tree digest\n        shell: bash\n        run: uv run python scripts/verify_portable_runtime_pin.py --public-root "$RUNNER_TEMP/portable-runtime"\n'''
          pos = text.rfind(needle)
          text = text[:pos] + replacement + text[pos + len(needle):]
          path.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/fix-v2-windows-verifier-shell.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/vendor-sync-portable-runtime-public-v2.yml
          git commit -m "ci: fix Windows staging verifier path expansion"
          git push origin HEAD:vendor/portable-runtime-0a22ad07-public-v2
