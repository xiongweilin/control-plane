name: C2 final fixup

on:
  push:
    branches:
      - c2/repair-resolution-axes

permissions:
  contents: write

jobs:
  fixup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply focused C2 fixes
        shell: python
        run: |
          from pathlib import Path

          storage = Path("src/control_plane/storage.py")
          text = storage.read_text()
          old = '''                    "[]",\n                    now,\n                    now,\n                    now,\n'''
          new = '''                    "[]",\n                    None,\n                    now,\n                    now,\n'''
          if old not in text:
              raise SystemExit("storage initialization anchor not found")
          storage.write_text(text.replace(old, new, 1))

          tests = Path("tests/test_repair_resolution.py")
          text = tests.read_text()
          text = text.replace(
              '    assert row["resolution_updated_at"] is not None\n    store.close()\n\n\ndef test_set_repair_status_cannot_write_resolution_axes',
              '    assert row["resolution_updated_at"] is None\n    store.close()\n\n\ndef test_set_repair_status_cannot_write_resolution_axes',
              1,
          )
          anchor = '''def test_restored_verified_with_proof_refs_persists(tmp_path) -> None:\n'''
          addition = '''@pytest.mark.parametrize(\n    ("resolution_kind", "restoration_status"),\n    [\n        (ResolutionKind.REJECTED, RestorationStatus.VERIFIED),\n        (ResolutionKind.ESCALATED, RestorationStatus.FAILED),\n    ],\n)\ndef test_evidence_bearing_restoration_requires_proof_refs(\n    tmp_path, resolution_kind: ResolutionKind, restoration_status: RestorationStatus\n) -> None:\n    store = Store(tmp_path / f"{resolution_kind.value}-{restoration_status.value}.db")\n    store.create_repair("repair-evidence", "fp-evidence", "{}")\n    with pytest.raises(ValueError, match="requires restoration proof refs"):\n        store.set_repair_resolution(\n            "repair-evidence",\n            resolution_kind=resolution_kind,\n            restoration_status=restoration_status,\n        )\n    row = store.get_repair("repair-evidence")\n    assert row is not None\n    assert row["resolution_kind"] == ResolutionKind.UNRESOLVED.value\n    assert row["restoration_status"] == RestorationStatus.UNVERIFIED.value\n    store.close()\n\n\ndef test_non_restored_disposition_can_carry_verified_restoration_with_proof(tmp_path) -> None:\n    store = Store(tmp_path / "rejected-verified.db")\n    store.create_repair("repair-independent", "fp-independent", "{}")\n    store.set_repair_resolution(\n        "repair-independent",\n        resolution_kind=ResolutionKind.REJECTED,\n        restoration_status=RestorationStatus.VERIFIED,\n        proof_refs=("proof-independent",),\n    )\n    row = store.get_repair("repair-independent")\n    assert row is not None\n    assert row["resolution_kind"] == ResolutionKind.REJECTED.value\n    assert row["restoration_status"] == RestorationStatus.VERIFIED.value\n    assert json.loads(row["restoration_proof_refs_json"]) == ["proof-independent"]\n    store.close()\n\n\n'''
          if anchor not in text:
              raise SystemExit("test insertion anchor not found")
          tests.write_text(text.replace(anchor, addition + anchor, 1))

          adr = Path("docs/decisions/0023-repair-resolution-axes.md")
          text = adr.read_text()
          old = '`UNVERIFIED` means qualifying restoration evidence has not yet been established and makes no claim about reality. `UNKNOWN` means observation or checking occurred but the result remains indeterminate.\n\nPersist restoration proof lineage separately as `restoration_proof_refs_json`. Structurally, `restored` and `no_action_required` require `restoration_status=verified` and at least one proof reference.'
          new = '`UNVERIFIED` means qualifying restoration evidence has not yet been established and makes no claim about reality. `UNKNOWN` means the current reality result cannot be determined, including when available evidence is unavailable or insufficient.\n\nPersist restoration proof lineage separately as `restoration_proof_refs_json`. The restoration axis itself requires evidence lineage for evidence-bearing judgments: both `verified` and `failed` require at least one restoration proof reference. Orthogonally, `restored` and `no_action_required` require `restoration_status=verified`.'
          if old not in text:
              raise SystemExit("ADR semantic anchor not found")
          text = text.replace(old, new, 1)
          text = text.replace(
              'Newly created repairs initialize explicitly to `unverified + unresolved`.',
              'Newly created repairs initialize explicitly to `unverified + unresolved`. Both historical and new rows begin with `resolution_updated_at=NULL`; that timestamp records a real resolution/restoration judgment write, not schema initialization.',
              1,
          )
          adr.write_text(text)

          Path(".github/workflows/c2-final-fixup.yml").unlink()
      - name: Commit fixups and remove bootstrap workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/control_plane/storage.py tests/test_repair_resolution.py docs/decisions/0023-repair-resolution-axes.md .github/workflows/c2-final-fixup.yml
          git commit -m "fix(c2): tighten restoration evidence and audit timestamp semantics"
          git push
