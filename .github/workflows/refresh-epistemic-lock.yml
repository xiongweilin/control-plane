name: Refresh epistemic dependency lock

on:
  push:
    branches:
      - feat/meta-controller-epistemic-loop-v1
    paths:
      - pyproject.toml
      - .github/workflows/refresh-epistemic-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/meta-controller-epistemic-loop-v1
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Refresh lock
        run: uv lock
      - name: Remove one-shot workflow and commit lock
        run: |
          rm .github/workflows/refresh-epistemic-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock .github/workflows/refresh-epistemic-lock.yml
          git commit -m "chore: refresh hardened epistemic dependency lock"
          git push origin HEAD:feat/meta-controller-epistemic-loop-v1
