name: C4a first-owner cleanup

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c4a/verifier-obligation-owner
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - name: Remove non-owner projection seams
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8-sig")
              if old not in text:
                  raise SystemExit(f"missing C4a cleanup anchor in {path}: {old[:180]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/control_plane/service.py",
              "from .verifier import CheckResult, VerificationReport, Verifier, obligation_refs_for_checks\n",
              "from .verifier import CheckResult, VerificationReport, Verifier\n",
          )
          replace_once(
              "src/control_plane/service.py",
              '''        # Carry the exact per-check obligation projection into the typed\n        # report.  The portable authority will persist this declaration on\n        # Work/Run before terminal proof validation; it must never infer a\n        # complete built-in obligation set from one provider boolean.\n        report.obligation_refs = obligation_refs_for_checks(report.checks)\n        if self.portable_authority is not None and report.obligation_refs:\n''',
              '''        # Persist only the verifier-owned declaration. The service does not\n        # derive or widen check-to-obligation coverage.\n        if self.portable_authority is not None and report.obligation_refs:\n''',
          )
          replace_once(
              "src/control_plane/portable_authority.py",
              '''                "evidence_ref": check.evidence_ref,\n                "obligation_ref": obligation_refs_for_checks([check]),\n''',
              '''                "evidence_ref": check.evidence_ref,\n''',
          )
          PY
      - name: Mechanical checks
        run: |
          uv run ruff check src/control_plane/service.py src/control_plane/portable_authority.py src/control_plane/verifier.py
          uv run python -m pytest tests/test_verifier.py tests/test_personal_runtime_authority.py
      - name: Commit clean first-owner product state
        shell: bash
        run: |
          git rm .github/workflows/c4a-first-owner-cleanup.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/control_plane/service.py src/control_plane/portable_authority.py
          git commit -m "C4a: remove non-verifier projection seams"
          git push origin HEAD:c4a/verifier-obligation-owner
