name: Apply epistemic loop v1

on:
  push:
    branches: [feat/meta-controller-epistemic-loop-v1]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/meta-controller-epistemic-loop-v1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply migration
        run: python scripts/apply_epistemic_loop_v1.py
      - name: Commit migration
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pyproject.toml src/control_plane/alert_policy.py
          git commit -m 'feat: wire repair policy into epistemic control loop'
          git push origin HEAD:feat/meta-controller-epistemic-loop-v1
