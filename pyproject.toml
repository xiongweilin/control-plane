[project]
name = "control-plane"
version = "0.1.0"
description = "Personal platform control plane: alert-driven repair agent with evidence semantics"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.9,<3",
    "httpx>=0.27,<1",
    "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=5,<8",
    "ruff>=0.9,<1",
    "mypy>=1.10,<2",
]

[project.scripts]
runtime = "portable_runtime.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/control_plane", "src/portable_runtime"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"src/control_plane/config.py" = ["S104"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
show_error_codes = true
exclude = ["tests/"]

[tool.coverage.run]
omit = ["tests/*", ".venv/*"]
