[project]
name = "control-plane"
version = "0.1.0"
description = "Personal platform control plane: alert-driven repair agent with evidence semantics"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.9,<3",
    "httpx>=0.27,<1",
    "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=5,<7",
    "ruff>=0.9,<1",
    "mypy>=1.10,<2",
]

[project.scripts]
runtime = "portable_runtime.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# TODO(portable_runtime-extract): after portable-runtime repo is published, replace
# dual-package build with single package + external dependency:
#   dependencies = ["portable-runtime @ git+ssh://github.com/ratiolin/portable-runtime.git"]
# Keep both packages for now to allow dual_write parity; do not split yet (gate §64).
[tool.hatch.build.targets.wheel]
packages = ["src/control_plane", "src/portable_runtime"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"src/control_plane/config.py" = ["S104"]
# Vendored src/portable_runtime mirrors ratiolin/portable-runtime pyproject
# per-file-ignores so the tree stays byte-identical to upstream.
"src/portable_runtime/core/knowledge.py" = ["E501", "S110", "SIM102", "W291"]
"src/portable_runtime/core/registry.py" = ["E501"]
"src/portable_runtime/core/reality_boundary.py" = ["S110", "SIM105", "E501", "S112", "B904"]
"src/portable_runtime/core/router.py" = ["S110", "SIM105", "E501", "S112", "F841", "SIM102"]
"src/portable_runtime/core/runtime.py" = ["S110", "SIM105", "E501"]
"src/portable_runtime/stores/memory.py" = ["S110", "SIM105", "E501", "SIM102"]
"src/portable_runtime/stores/sqlite.py" = ["S110", "SIM105", "E501", "UP017", "F401"]
"src/portable_runtime/core/policies.py" = ["S110", "SIM105", "E501", "B007", "UP037"]
"src/portable_runtime/workflows/procedure.py" = ["S110", "SIM105", "E501", "B904", "SIM103", "SIM102", "S112", "SIM108", "W291"]
"src/portable_runtime/records/*.py" = ["E501", "S110", "SIM102", "SIM103", "B904"]
"src/portable_runtime/core/workflows.py" = ["S112"]
"src/portable_runtime/workflows/context.py" = ["S110", "SIM105", "E501"]
"src/portable_runtime/workflows/daily_scan/workflow.py" = ["S110", "SIM105", "E501"]
"src/portable_runtime/workflows/knowledge_consolidation/workflow.py" = ["S110", "SIM105", "E501", "W291"]
"src/portable_runtime/workflows/incident_repair/workflow.py" = ["S110", "SIM105"]
"src/portable_runtime/api/http.py" = ["S110", "SIM105", "E501"]
"src/portable_runtime/api/cli.py" = ["S110", "E501", "F841"]
"src/portable_runtime/stores/bundle.py" = ["E501", "B007", "S112", "S110", "I001"]
"src/portable_runtime/interfaces/transport.py" = ["S110", "SIM105", "E501", "UP042", "SIM102"]
"src/portable_runtime/triggers/base.py" = ["UP042"]
"src/portable_runtime/triggers/webhook/trigger.py" = ["S110", "SIM105"]
"src/portable_runtime/triggers/alertmanager/trigger.py" = ["S110", "SIM105"]
"src/portable_runtime/core/boundary.py" = ["S110", "SIM105", "E501", "S112", "SIM102", "F821"]
"src/portable_runtime/core/capability_contract.py" = ["E501", "SIM103"]
"src/portable_runtime/core/invocation.py" = ["E501", "SIM102", "S110", "SIM105"]
"src/portable_runtime/core/independence.py" = ["E501", "S110", "SIM102", "UP037"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
show_error_codes = true
exclude = ["tests/", "src/portable_runtime/core/boundary.py", "src/portable_runtime/core/reality_boundary.py"]

[[tool.mypy.overrides]]
module = "portable_runtime.core.reality_boundary"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "portable_runtime.core.independence"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "portable_runtime.core.capability_contract"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "portable_runtime.core.invocation"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "portable_runtime.core.boundary"
ignore_missing_imports = true
ignore_errors = true


[[tool.mypy.overrides]]
module = "portable_runtime.*"
warn_unused_ignores = false
[tool.coverage.run]
omit = ["tests/*", ".venv/*"]

