[project]
name = "control-plane"
version = "0.2.0"
description = "Personal Windows/monitoring/Feishu profile for Agent Kernel"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "portable-runtime @ git+https://github.com/xiongweilin/agent-kernel.git@6deb4ab80e4c22470a6c0f72c827c45569bcba54",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.9,<3",
    "httpx>=0.27,<1",
    "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.9,<1",
    "mypy>=1.10,<2",
]

[project.scripts]
control-plane = "control_plane.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/control_plane"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E501"]
"src/control_plane/app.py" = ["E501"]
"src/control_plane/config.py" = ["E501"]
"src/control_plane/codex_boundary.py" = ["E501", "S603", "S607"]
"src/control_plane/personal_operations.py" = ["E501", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = false
no_implicit_optional = true
show_error_codes = true
